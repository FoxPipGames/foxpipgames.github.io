<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />

  <title>공지사항 | 밀어서 셋! (Triple Slide!)</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      background: #ffffff;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 16px;
      border-bottom: 2px solid #222;
      padding-bottom: 16px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .game-name {
      font-size: 15px;
      color: #666;
    }

    .lang button {
      border: 1px solid #d4d4d8;
      background: #fff;
      color: #222;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .lang button:first-child {
      border-radius: 6px 0 0 6px;
    }

    .lang button:last-child {
      border-radius: 0 6px 6px 0;
      border-left: 0;
    }

    .lang button[aria-pressed="true"] {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .notice {
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fff;
    }

    .notice summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .notice summary::-webkit-details-marker {
      display: none;
    }

    .notice summary::after {
      content: "▾";
      color: #666;
      flex: none;
    }

    .notice[open] summary::after {
      content: "▴";
    }

    .notice-title {
      font-weight: 700;
      flex: 1;
      word-break: break-word;
    }

    .notice-date {
      font-size: 13px;
      color: #666;
      flex: none;
    }

    .notice-body {
      padding: 0 16px 16px;
      border-top: 1px solid #f0f0f2;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .notice-body p {
      margin: 12px 0 0;
    }

    .notice-link {
      display: inline-block;
      margin-top: 12px;
      color: #2563eb;
      word-break: break-all;
    }

    .message {
      color: #666;
      padding: 20px 0;
    }

    .footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #dddddd;
      font-size: 14px;
      color: #666666;
    }

    @media (max-width: 520px) {
      .container { padding: 28px 16px 60px; }
      h1 { font-size: 26px; }
      .notice summary { flex-wrap: wrap; }
      .notice-date { width: 100%; order: 3; }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1 id="page-title">공지사항</h1>

    <div class="toolbar">
      <span class="game-name" id="game-name">밀어서 셋!</span>
      <span class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-ko" aria-pressed="false">한국어</button><button type="button" id="btn-en" aria-pressed="false">English</button>
      </span>
    </div>

    <div id="list" aria-live="polite"></div>
    <noscript><p class="message">공지를 보려면 JavaScript를 켜 주세요. / Please enable JavaScript to view notices.</p></noscript>

    <div class="footer">
      © 2026 폭스핍 (FoxPip). All rights reserved.
    </div>

  </main>

  <script>
    (function () {
      "use strict";

      // 공지 데이터: 같은 폴더의 notice.json (앱 팝업과 같은 파일)
      var DATA_URL = "notice.json";
      var ALLOWED_LINK_PREFIX = "https://foxpipgames.github.io/";

      var TEXT = {
        ko: {
          docTitle: "공지사항 | 밀어서 셋! (Triple Slide!)",
          title: "공지사항",
          game: "밀어서 셋!",
          empty: "등록된 공지가 없습니다.",
          error: "공지를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",
          loading: "불러오는 중…",
          period: "게시 기간",
          ended: "(종료)"
        },
        en: {
          docTitle: "Notices | Triple Slide!",
          title: "Notices",
          game: "Triple Slide!",
          empty: "There are no notices.",
          error: "Could not load notices. Please try again later.",
          loading: "Loading…",
          period: "Posted",
          ended: "(ended)"
        }
      };

      var listEl = document.getElementById("list");
      var data = null;
      var lang = (navigator.language || "en").toLowerCase().indexOf("ko") === 0 ? "ko" : "en";

      function pick(obj, l) {
        if (!obj || typeof obj !== "object") return "";
        var other = l === "ko" ? "en" : "ko";
        if (typeof obj[l] === "string" && obj[l].trim()) return obj[l];
        if (typeof obj[other] === "string" && obj[other].trim()) return obj[other];
        return "";
      }

      function parseDate(s) {
        if (typeof s !== "string") return null;
        var t = Date.parse(s);
        return isNaN(t) ? null : t;
      }

      function fmt(t, l) {
        return new Date(t).toLocaleDateString(l === "ko" ? "ko-KR" : "en-US", {
          timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
        });
      }

      function setLang(l) {
        lang = l;
        document.documentElement.lang = l;
        document.title = TEXT[l].docTitle;
        document.getElementById("page-title").textContent = TEXT[l].title;
        document.getElementById("game-name").textContent = TEXT[l].game;
        document.getElementById("btn-ko").setAttribute("aria-pressed", String(l === "ko"));
        document.getElementById("btn-en").setAttribute("aria-pressed", String(l === "en"));
        render();
      }

      function message(text) {
        listEl.textContent = "";
        var p = document.createElement("p");
        p.className = "message";
        p.textContent = text;
        listEl.appendChild(p);
      }

      function render() {
        if (data === null) { message(TEXT[lang].loading); return; }
        if (data === false) { message(TEXT[lang].error); return; }

        var now = Date.now();
        var items = [];
        (Array.isArray(data.notices) ? data.notices : []).forEach(function (n) {
          if (!n || typeof n !== "object") return;
          var start = parseDate(n.startAt);
          var end = parseDate(n.endAt);
          var title = pick(n.title, lang);
          if (start === null || end === null || !title) return;
          if (start > now) return; // 게시 전 공지는 표시하지 않음
          items.push({ n: n, start: start, end: end, title: title });
        });
        // 최근 게시한 공지가 위로 (지난 공지도 기록으로 남겨 둠)
        items.sort(function (a, b) { return b.start - a.start; });

        if (!items.length) { message(TEXT[lang].empty); return; }

        listEl.textContent = "";
        items.forEach(function (it) {
          var d = document.createElement("details");
          d.className = "notice";

          var s = document.createElement("summary");
          var t = document.createElement("span");
          t.className = "notice-title";
          t.textContent = it.title;
          var dt = document.createElement("span");
          dt.className = "notice-date";
          dt.textContent = fmt(it.start, lang) + (it.end < now ? " " + TEXT[lang].ended : "");
          s.appendChild(t);
          s.appendChild(dt);
          d.appendChild(s);

          var body = document.createElement("div");
          body.className = "notice-body";
          var p = document.createElement("p");
          p.textContent = pick(it.n.body, lang);
          body.appendChild(p);

          var link = it.n.link;
          if (link && typeof link.url === "string" && link.url.indexOf(ALLOWED_LINK_PREFIX) === 0) {
            var a = document.createElement("a");
            a.className = "notice-link";
            a.href = link.url;
            a.rel = "noopener";
            a.textContent = pick(link.label, lang) || link.url;
            body.appendChild(a);
          }
          d.appendChild(body);
          listEl.appendChild(d);
        });
      }

      document.getElementById("btn-ko").addEventListener("click", function () { setLang("ko"); });
      document.getElementById("btn-en").addEventListener("click", function () { setLang("en"); });

      setLang(lang);

      fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (j) {
          if (!j || j.schema !== 1) throw new Error("unsupported schema");
          data = j;
          render();
        })
        .catch(function () {
          data = false;
          render();
        });
    })();
  </script>
</body>
</html>
